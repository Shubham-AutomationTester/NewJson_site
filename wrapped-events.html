<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wrapped JSON-LD Events</title>
  <link rel="stylesheet" href="styles.css">

  <script type="application/ld+json">
  /*<![CDATA[*/
  {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "First Event",
    "description": "First wrapped JSON-LD event for crawler QA.",
    "startDate": "2026-09-10T10:00:00-04:00",
    "isAccessibleForFree": true,
    "maximumAttendeeCapacity": 120,
    "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
    "location": {
      "@type": "Place",
      "name": "Harborside Campus",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Providence",
        "addressRegion": "RI",
        "postalCode": "02903",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 41.8240,
        "longitude": -71.4128
      }
    }
  }
  /*]]>*/
  </script>

  <script type="application/ld+json">

    /*<![CDATA[*/
    {
      "@context": "https://schema.org",
      "@type": "Event",
      "name": "Second Event",
      "description": "Second wrapped JSON-LD event with leading and trailing whitespace.",
      "startDate": "2026-09-11T14:30:00-04:00",
      "isAccessibleForFree": false,
      "maximumAttendeeCapacity": 85,
      "ratingValue": 4.7
    }
    /*]]>*/

  </script>
</head>
<body>
<header><h1>Wrapped JSON-LD Events</h1></header>
<main>
  <div class="card">
    <p>This page contains <strong>two</strong> JSON-LD blocks wrapped in <code>/*&lt;![CDATA[*/</code> and <code>/*]]&gt;*/</code>.</p>
    <p>For selector <code>$.name</code> with a multi-valued field, expected values are:</p>
    <pre>First Event
Second Event</pre>
    <p><a href="index.html">Back to home</a></p>
  </div>
</main>
</body>
</html>
